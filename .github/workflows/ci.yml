name: CI

# Gate every PR (and post-merge main) on the checks a contributor runs locally:
# strict mypy anywhere, and the real-process test suite on macOS, plus the
# checks every Curlew Labs repository shares, pyright among them. See the README
# "Development" section.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # renovate: datasource=python-version depName=python
          python-version: "3.14.10"
      - name: Install the pinned tools
        run: python -m pip install -r requirements-dev.txt
      - name: mypy (strict)
        run: mypy

  test:
    # The measurement reads a kernel task-accounting structure, so the suite
    # runs against a real macOS kernel: a layout or semantic change there is
    # exactly the regression it exists to catch.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The suite compiles its own target process (test/footprint_target.c
      # explains why nothing already on the system can serve as one) and reads
      # the real ledger. `cc` and /usr/bin/python3 both come from the Command
      # Line Tools that are preinstalled on the image.
      - name: unit and integration tests
        run: /usr/bin/python3 -m unittest discover -s test -v
      # The history purge cases skip in the run above: attaching a volume that
      # fseventsd records, and calling the purge, both need root. They purge
      # only the disk image they attach, never the runner's own volumes.
      - name: FSEvents history tests (root)
        run: sudo /usr/bin/python3 -m unittest discover -s test -p 'test_fsevents_history.py' -v

  baseline:
    # The checks every Curlew Labs repository runs, in one place:
    # https://github.com/curlewlabs-com/ci-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: curlewlabs-com/ci-baseline@6a09b1b1ebea0453f9a34fce974610ef2544ec3a # v0.3.0

  conclusion:
    # The one check branch protection requires, so adding or renaming a job
    # above needs no settings change - only this list.
    needs: [lint, test, baseline]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require every job to pass
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          BASELINE: ${{ needs.baseline.result }}
        run: test "$LINT" = success && test "$TEST" = success && test "$BASELINE" = success
